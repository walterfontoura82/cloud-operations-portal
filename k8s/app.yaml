apiVersion: v1
kind: Namespace
metadata:
  name: cloud-operations-portal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-operations-portal
  namespace: cloud-operations-portal
  labels:
    app: cloud-operations-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-operations-portal
  template:
    metadata:
      labels:
        app: cloud-operations-portal
    spec:
      containers:
        - name: api
          image: 852100867941.dkr.ecr.us-east-1.amazonaws.com/cloud-operations-portal:4b052fb6f8aa3e2d2551a35f3fc02a6d6138a49c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-operations-portal
  namespace: cloud-operations-portal
spec:
  type: LoadBalancer
  selector:
    app: cloud-operations-portal
  ports:
    - name: http
      port: 80
      targetPort: http

